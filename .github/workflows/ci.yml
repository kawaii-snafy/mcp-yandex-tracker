name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The test suite and the docs generator run the TypeScript sources
      # directly, which needs a Node with type stripping (>= 22.18).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Node strips the types without checking them, so this step is not optional.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The tool index is derived from the registry; a stale one means the
      # description and the code have drifted apart.
      - name: Docs are in sync
        run: |
          npm run docs:tools
          git diff --exit-code -- docs/TOOLS.md

      - name: Build
        run: npm run build

      # The suite ends with a stdio test that drives the built bundle, which is
      # how a host will run it.
      - name: Test
        run: npm test

  smoke-node:
    # The published artifact must run on every Node the package supports.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Handshake over stdio
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | node dist/cli.js > out.jsonl
          node -e '
            const lines = require("fs").readFileSync("out.jsonl", "utf8").trim().split("\n").map(JSON.parse);
            const tools = lines.find((m) => m.id === 2).result.tools;
            if (tools.length === 0) throw new Error("no tools listed");
            console.log(`${tools.length} tools listed`);
          '
