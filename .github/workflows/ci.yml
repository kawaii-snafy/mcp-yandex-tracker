name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The docs generator runs the TypeScript sources directly, which needs a
      # Node with type stripping (>= 22.18).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # `prepare` builds build/ as part of this, the same way it does for a user.
      - name: Install
        run: npm ci

      # Node strips the types without checking them, so this step is not optional.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The tool index is derived from the registry; a stale one means the
      # description and the code have drifted apart.
      - name: Docs are in sync
        run: |
          npm run docs:tools
          git diff --exit-code -- docs/TOOLS.md

  install-from-git:
    # Users run `npx github:kawaii-snafy/yandex-tracker-mcp`: npm clones the
    # repo, installs the dev dependencies, runs `prepare` and packs `files`.
    # Do exactly that with this commit, on every Node the package supports.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # Install first, on its own: the clone and the build take longer than the
      # handshake below keeps stdin open. With stdin at EOF the server starts
      # and exits at once, which is all this step needs from it.
      - name: Install from git
        run: |
          echo "SPEC=git+file://$GITHUB_WORKSPACE#$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          npx -y "git+file://$GITHUB_WORKSPACE#$(git rev-parse HEAD)" < /dev/null

      - name: Handshake over stdio
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | npx -y "$SPEC" > out.jsonl
          node -e '
            const lines = require("fs").readFileSync("out.jsonl", "utf8").trim().split("\n").map(JSON.parse);
            const tools = lines.find((m) => m.id === 2).result.tools;
            if (tools.length !== 3) throw new Error(`expected 3 tools, got ${tools.length}`);
            console.log(tools.map((t) => t.name).join(", "));
          '
